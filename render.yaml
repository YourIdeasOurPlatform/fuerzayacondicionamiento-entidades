services:
  - type: web
    name: fuerzayacondicionamiento-entidades
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Sin esto `/` responde 404 (static-no-asset) aunque exista index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PUBLIC_API_URL
        sync: false
